<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zexto Option — Admin Panel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a0e18;color:#e8ecf4;min-height:100vh;overflow:hidden}
  .layout{display:flex;width:100vw;height:100vh}

  /* SIDEBAR */
  .sidebar{width:240px;background:#0b0e18;border-right:1px solid #1c2238;display:flex;flex-direction:column;flex-shrink:0}
  .sidebar-logo{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid #1c2238}
  .logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#00ff9d,#00cc7d);display:flex;align-items:center;justify-content:center}
  .logo-name{font-size:15px;font-weight:700;letter-spacing:-0.3px}
  .logo-sub{font-size:10px;color:#7a85a0;margin-top:1px}
  .nav{flex:1;padding:12px 10px;overflow-y:auto}
  .nav-section{font-size:10px;color:#4a5570;text-transform:uppercase;letter-spacing:1px;font-weight:700;padding:12px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:#7a85a0;font-size:13px;font-weight:500;transition:all 0.15s;border:1px solid transparent;margin-bottom:2px}
  .nav-item:hover{background:#1a2035;color:#e8ecf4}
  .nav-item.active{background:#00ff9d15;color:#00ff9d;border-color:#00ff9d33}
  .nav-icon{font-size:16px;width:20px;text-align:center}
  .nav-badge{margin-left:auto;font-size:10px;padding:2px 7px;background:#ef4444;color:#fff;border-radius:10px;font-weight:700;font-family:'JetBrains Mono',monospace}
  .sidebar-foot{padding:14px 18px;border-top:1px solid #1c2238;display:flex;align-items:center;gap:10px;font-size:11px;color:#7a85a0}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#00ff9d;animation:pulse 1.5s infinite}
  .status-dot.offline{background:#ef4444}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

  /* MAIN */
  .main{flex:1;overflow-y:auto;padding:24px 32px}
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid #1c2238}
  .page-title{font-size:22px;font-weight:700;letter-spacing:-0.5px}
  .page-subtitle{font-size:11px;color:#7a85a0;margin-top:2px}
  .btn{padding:8px 16px;border-radius:7px;border:1px solid #1c2238;background:#111626;color:#e8ecf4;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
  .btn:hover{border-color:#00ff9d55}
  .btn-primary{background:linear-gradient(135deg,#00ff9d,#00cc7d);color:#0a0e18;border:none}
  .btn-danger{background:#ef444422;color:#ef4444;border-color:#ef444455}
  .btn-danger:hover{background:#ef4444;color:#fff}
  .btn-sm{padding:5px 10px;font-size:11px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
  .stat{background:#111626;border:1px solid #1c2238;border-radius:10px;padding:14px 16px;transition:all 0.15s}
  .stat:hover{border-color:#00ff9d44}
  .stat-lbl{font-size:10px;color:#7a85a0;text-transform:uppercase;letter-spacing:0.5px;font-weight:700}
  .stat-val{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-top:4px}
  .stat-chg{font-size:10px;margin-top:3px;font-family:'JetBrains Mono',monospace;color:#7a85a0}

  .searchbar{display:flex;gap:10px;margin-bottom:16px}
  .search-input{flex:1;max-width:360px;background:#111626;border:1px solid #1c2238;border-radius:7px;padding:9px 12px;color:#e8ecf4;font-size:12px;outline:none;font-family:inherit}
  .search-input:focus{border-color:#00ff9d66}

  .table-wrap{background:#111626;border:1px solid #1c2238;border-radius:10px;overflow:hidden;overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:12px 16px;font-size:10px;font-weight:700;color:#7a85a0;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid #1c2238;background:#0b0e18;white-space:nowrap}
  td{padding:12px 16px;border-bottom:1px solid #1a2035;font-size:13px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#1a2035}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#2a2f45,#1a2035);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#e8ecf4;flex-shrink:0}
  .user-cell{display:flex;align-items:center;gap:10px}
  .user-name{font-weight:600;color:#e8ecf4}
  .user-email{font-size:11px;color:#7a85a0;font-family:'JetBrains Mono',monospace}
  .badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:0.3px}
  .b-green{background:#00ff9d22;color:#00ff9d}
  .b-red{background:#ef444422;color:#ef4444}
  .b-yellow{background:#f59e0b22;color:#f59e0b}
  .b-blue{background:#3b82f622;color:#60a5fa}
  .mono{font-family:'JetBrains Mono',monospace}
  .c-green{color:#00ff9d}
  .c-red{color:#ef4444}
  .row-actions{display:flex;gap:4px;justify-content:flex-end}
  .icon-btn{width:28px;height:28px;border-radius:5px;border:1px solid #1c2238;background:transparent;color:#7a85a0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
  .icon-btn:hover{background:#1a2035;color:#e8ecf4}

  .empty{padding:60px 20px;text-align:center;color:#4a5570;font-size:13px}
  .empty-icon{font-size:48px;margin-bottom:12px;opacity:0.5}
  .loading{padding:40px;text-align:center;color:#7a85a0;font-size:12px}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
  .modal-overlay.active{display:flex}
  .modal{background:#111626;border:1px solid #1c2238;border-radius:12px;width:640px;max-width:90vw;max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #1c2238}
  .modal-title{font-size:15px;font-weight:700}
  .modal-close{background:none;border:none;color:#7a85a0;cursor:pointer;font-size:22px;padding:0 6px;line-height:1}
  .modal-body{flex:1;overflow-y:auto;padding:20px}
  .field{margin-bottom:14px}
  .field-lbl{font-size:10px;color:#7a85a0;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:4px}
  .field-val{font-size:13px;color:#e8ecf4;font-family:'JetBrains Mono',monospace}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:#111626;border:1px solid #1c2238;border-radius:10px;padding:16px;transition:all 0.15s}
  .card:hover{border-color:#00ff9d44}

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:#0a0e18}
  ::-webkit-scrollbar-thumb{background:#1c2238;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#2a2f45}

  @media(max-width:768px){
    .sidebar{width:60px}
    .sidebar-logo>div:last-child,.nav-section,.nav-item>span:not(.nav-icon):not(.nav-badge),.sidebar-foot>span:last-child{display:none}
    .nav-item{justify-content:center}
    .main{padding:16px}
  }
</style>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 76 76" xmlns="http://www.w3.org/2000/svg" width="26" height="26">
          <path d="M 18 22 L 58 22 L 22 54 L 58 54" stroke="#0a0e18" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="62" cy="18" r="4" fill="#0a0e18"/>
        </svg>
      </div>
      <div>
        <div class="logo-name">Zexto Admin</div>
        <div class="logo-sub">v1.0.0</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-section">Overview</div>
      <div class="nav-item active" data-page="dashboard" onclick="nav(this)"><span class="nav-icon">📊</span><span>Dashboard</span></div>

      <div class="nav-section">Management</div>
      <div class="nav-item" data-page="users" onclick="nav(this)"><span class="nav-icon">👥</span><span>Users</span><span class="nav-badge" id="navUsers">0</span></div>
      <div class="nav-item" data-page="pairs" onclick="nav(this)"><span class="nav-icon">💱</span><span>Pairs</span></div>
      <div class="nav-item" data-page="trades" onclick="nav(this)"><span class="nav-icon">📈</span><span>All Trades</span></div>

      <div class="nav-section">Finance</div>
      <div class="nav-item" data-page="deposits" onclick="nav(this)"><span class="nav-icon">💰</span><span>Deposits</span></div>
      <div class="nav-item" data-page="withdrawals" onclick="nav(this)"><span class="nav-icon">💸</span><span>Withdrawals</span></div>
      <div class="nav-item" data-page="kyc" onclick="nav(this)"><span class="nav-icon">📋</span><span>KYC</span></div>
      <div class="nav-item" data-page="deposit-promos" onclick="nav(this)"><span class="nav-icon">🎁</span><span>Deposit Promos</span></div>
      <div class="nav-item" data-page="support" onclick="nav(this)"><span class="nav-icon">🎫</span><span>Support</span><span class="nav-badge" id="navSupport">0</span></div>

      <div class="nav-section">Community</div>
      <div class="nav-item" data-page="affiliates" onclick="nav(this)"><span class="nav-icon">🤝</span><span>Affiliates</span><span class="nav-badge" id="navAffiliates">0</span></div>
      <div class="nav-item" data-page="ranking" onclick="nav(this)"><span class="nav-icon">🏅</span><span>Ranking</span></div>
      <div class="nav-item" data-page="tournaments" onclick="nav(this)"><span class="nav-icon">🏆</span><span>Tournaments</span></div>
      <div class="nav-item" data-page="signals" onclick="nav(this)"><span class="nav-icon">📡</span><span>Signals</span></div>
    </nav>

    <div class="sidebar-foot" style="flex-direction:column;align-items:stretch;gap:8px">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">API Online</span>
      </div>
      <button onclick="adminLogout()" style="width:100%;padding:7px 12px;border-radius:6px;border:1px solid #ef444444;background:#ef444415;color:#ef4444;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s">🔓 Logout</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div id="pageContent"><div class="loading">Loading...</div></div>
  </main>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Details</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const API = '';
let currentPage = 'dashboard';
let refreshIv = null;
let usersSearch = '';

// Get admin token from cookie
function getAdminToken() {
  const match = document.cookie.match(/admin_token=([^;]+)/);
  return match ? match[1] : null;
}

// Check auth on load
if (!getAdminToken()) {
  window.location.href = '/admin-login';
}

// Logout function
function adminLogout() {
  document.cookie = 'admin_token=;path=/;max-age=0';
  window.location.href = '/admin-login';
}

const getInitials = n => n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const fmtMoney = n => '$' + (Math.abs(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK = n => {n=Math.abs(n||0);if(n>=1000000)return '$'+(n/1000000).toFixed(1)+'M';if(n>=1000)return '$'+(n/1000).toFixed(1)+'K';return '$'+n.toFixed(0);}
const timeAgo = d => {const s=Math.floor((Date.now()-new Date(d).getTime())/1000);if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';};
const fmtDate = d => new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

async function api(path, opts={}){
  try{
    const token = getAdminToken();
    const headers = {'Content-Type':'application/json'};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const r = await fetch(API + path, {
      method: opts.method || 'GET',
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    if (r.status === 401) {
      adminLogout();
      return null;
    }
    return await r.json();
  }catch(e){ return null; }
}

function nav(el){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  currentPage = el.dataset.page;
  loadPage(currentPage);
}

let _checkingStatus = false;
async function checkStatus(){
  if(_checkingStatus) return;
  _checkingStatus = true;
  try {
    const d = await api('/api');
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if(d && d.success){ dot.classList.remove('offline'); txt.textContent='API Online'; }
    else{ dot.classList.add('offline'); txt.textContent='API Offline'; }
  } catch(e){}
  _checkingStatus = false;
}

let _updatingBadges = false;
async function updateBadges(){
  if(_updatingBadges) return;
  _updatingBadges = true;
  try {
    const d = await api('/api/admin/stats');
    if(d && d.success) document.getElementById('navUsers').textContent = d.stats.totalUsers;
  } catch(e){}
  // Affiliate badge
  try {
    const af = await api('/api/admin/affiliates/stats');
    if(af && af.success) document.getElementById('navAffiliates').textContent = af.stats.totalPartners || 0;
  } catch(e){}
  // Support badge
  try {
    const st = await api('/api/admin/support/all?status=open&limit=1');
    if(st && st.success) document.getElementById('navSupport').textContent = st.total || 0;
  } catch(e){}
  _updatingBadges = false;
}

async function loadPage(page){
  document.getElementById('pageContent').innerHTML = '<div class="loading">Loading...</div>';
  if(refreshIv){ clearInterval(refreshIv); refreshIv=null; }
  const fn = {dashboard:renderDashboard,users:renderUsers,pairs:renderPairs,trades:renderTrades,deposits:renderDeposits,withdrawals:renderWithdrawals,kyc:renderKYC,ranking:renderRanking,tournaments:renderTournaments,signals:renderSignals,affiliates:renderAffiliatesPage,'affiliate-withdrawals':renderAffiliatesPage,promocodes:renderAffiliatesPage,'deposit-promos':renderDepositPromos,support:renderSupport}[page];
  if(fn) fn();
}

// DASHBOARD
async function renderDashboard(){
  const data = await api('/api/admin/stats');
  const s = data?.stats || {};
  document.getElementById('pageContent').innerHTML = `
    <div class="page-header"><div><div class="page-title">Dashboard</div><div class="page-subtitle">Overview of platform activity</div></div></div>
    <div class="stats">
      <div class="stat"><div class="stat-lbl">Total Users</div><div class="stat-val">${s.totalUsers||0}</div><div class="stat-chg">Registered traders</div></div>
      <div class="stat"><div class="stat-lbl">Total Trades</div><div class="stat-val">${s.totalTrades||0}</div><div class="stat-chg c-green">Active: ${s.activeTrades||0}</div></div>
      <div class="stat"><div class="stat-lbl">Total Volume</div><div class="stat-val">${fmtK(s.totalVolume||0)}</div><div class="stat-chg">All time</div></div>
      <div class="stat"><div class="stat-lbl">Total P/L</div><div class="stat-val ${(s.totalPnl||0)>=0?'c-green':'c-red'}">${(s.totalPnl||0)>=0?'+':''}${fmtK(s.totalPnl||0)}</div><div class="stat-chg">Platform wide</div></div>
      <div class="stat"><div class="stat-lbl">Active Alerts</div><div class="stat-val">${s.totalAlerts||0}</div><div class="stat-chg">User alerts</div></div>
      <div class="stat"><div class="stat-lbl">Tournaments</div><div class="stat-val">${s.totalTournaments||0}</div><div class="stat-chg c-green">Live: ${s.liveTournaments||0}</div></div>
      <div class="stat"><div class="stat-lbl">Signals (24h)</div><div class="stat-val">${s.totalSignals||0}</div><div class="stat-chg">Auto-generated</div></div>
      <div class="stat"><div class="stat-lbl">Real Deposits</div><div class="stat-val">${fmtK(s.totalDeposits||0)}</div><div class="stat-chg">All users</div></div>
    </div>
    <div style="background:#111626;border:1px solid #1c2238;border-radius:10px;padding:20px">
      <div style="font-size:12px;color:#7a85a0;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:14px">Quick Access</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" onclick="nav(document.querySelector('[data-page=users]'))">👥 Manage Users</button>
        <button class="btn" onclick="nav(document.querySelector('[data-page=trades]'))">📈 View All Trades</button>
        <button class="btn" onclick="nav(document.querySelector('[data-page=kyc]'))">📋 KYC Review</button>
        <button class="btn" onclick="nav(document.querySelector('[data-page=tournaments]'))">🏆 Tournaments</button>
        <button class="btn" onclick="nav(document.querySelector('[data-page=deposits]'))">💰 Deposits</button>
      </div>
    </div>
  `;
  refreshIv = setInterval(()=>{ if(currentPage==='dashboard') renderDashboard(); }, 60000);
}

// USERS
async function renderUsers(){
  const data = await api('/api/admin/users?limit=100&search=' + encodeURIComponent(usersSearch));
  const users = data?.users || [];
  document.getElementById('pageContent').innerHTML = `
    <div class="page-header"><div><div class="page-title">Users</div><div class="page-subtitle">${data?.total || 0} registered traders</div></div></div>
    <div class="searchbar">
      <input class="search-input" id="userSearch" placeholder="Search by name or email..." value="${usersSearch}">
      <button class="btn btn-primary" onclick="searchUsers()">Search</button>
      ${usersSearch?'<button class="btn" onclick="clearSearch()">Clear</button>':''}
    </div>
    ${users.length===0 ? '<div class="empty"><div class="empty-icon">👥</div>No users found</div>' : `
    <div class="table-wrap"><table>
      <thead><tr><th>User</th><th>Country</th><th>Demo Balance</th><th>Real Balance</th><th>Trades</th><th>Win Rate</th><th>P/L</th><th>Joined</th><th></th></tr></thead>
      <tbody>${users.map(u=>`
        <tr>
          <td><div class="user-cell"><div class="avatar">${getInitials(u.name)}</div><div><div class="user-name">${u.name}</div><div class="user-email">${u.email}</div></div></div></td>
          <td style="font-size:18px">${u.country||'🌍'}</td>
          <td class="mono">${fmtMoney(u.demoBalance)}</td>
          <td class="mono c-green">${fmtMoney(u.realBalance)}</td>
          <td class="mono">${u.stats?.totalTrades||0}</td>
          <td class="mono">${u.stats?.totalTrades>0?((u.stats.wins/u.stats.totalTrades)*100).toFixed(1)+'%':'—'}</td>
          <td class="mono ${(u.stats?.totalPnl||0)>=0?'c-green':'c-red'}">${(u.stats?.totalPnl||0)>=0?'+':''}${fmtMoney(u.stats?.totalPnl||0)}</td>
          <td style="font-size:11px;color:#7a85a0">${fmtDate(u.createdAt)}</td>
          <td><div class="row-actions">
            <button class="icon-btn" onclick="viewUser('${u._id}')" title="View">👁</button>
            <button class="icon-btn" onclick="editBalance('${u._id}','${u.name.replace(/'/g,'')}',${u.demoBalance},${u.realBalance})" title="Edit Balance">💵</button>
            <button class="icon-btn" onclick="deleteUser('${u._id}','${u.name.replace(/'/g,'')}')" title="Delete">🗑</button>
          </div></td>
        </tr>`).join('')}</tbody>
    </table></div>`}
  `;
}

function searchUsers(){ usersSearch = document.getElementById('userSearch').value; renderUsers(); }
function clearSearch(){ usersSearch=''; renderUsers(); }

async function viewUser(id){
  const data = await api('/api/admin/users/'+id);
  if(!data?.success) return alert('Failed to load user');
  const {user, trades, activeTrades} = data;
  document.getElementById('modalTitle').textContent = 'User — ' + user.name;
  document.getElementById('modalBody').innerHTML = `
    <div class="detail-grid">
      <div class="field"><div class="field-lbl">Name</div><div class="field-val">${user.name}</div></div>
      <div class="field"><div class="field-lbl">Email</div><div class="field-val">${user.email}</div></div>
      <div class="field"><div class="field-lbl">Country</div><div class="field-val" style="font-size:22px">${user.country||'🌍'}</div></div>
      <div class="field"><div class="field-lbl">Joined</div><div class="field-val">${fmtDate(user.createdAt)}</div></div>
      <div class="field"><div class="field-lbl">Demo Balance</div><div class="field-val c-green">${fmtMoney(user.demoBalance)}</div></div>
      <div class="field"><div class="field-lbl">Real Balance</div><div class="field-val c-green">${fmtMoney(user.realBalance)}</div></div>
      <div class="field"><div class="field-lbl">Total Trades</div><div class="field-val">${user.stats?.totalTrades||0}</div></div>
      <div class="field"><div class="field-lbl">Win / Loss</div><div class="field-val"><span class="c-green">${user.stats?.wins||0}</span> / <span class="c-red">${user.stats?.losses||0}</span></div></div>

async function savePair(id){
  const isOtc = document.getElementById('f_otc').checked;
  const body = {
    symbol: document.getElementById('f_symbol').value.trim().toUpperCase(),
    short: document.getElementById('f_short').value.trim(),
    label: document.getElementById('f_label').value.trim(),
    pair: document.getElementById('f_pair').value.trim(),
    payout: +document.getElementById('f_payout').value,
    precision: +document.getElementById('f_precision').value,
    logo: document.getElementById('f_logo').value.trim(),
    category: document.getElementById('f_category').value,
    sortOrder: +document.getElementById('f_sortOrder').value,
    minAmount: +document.getElementById('f_minAmount').value,
    maxAmount: +document.getElementById('f_maxAmount').value,
    enabled: document.getElementById('f_enabled').checked,
    otc: isOtc,
  };
  if (isOtc) {
    body.basePrice = +document.getElementById('f_basePrice').value;
    body.volatility = +document.getElementById('f_volatility').value;
    body.flag = document.getElementById('f_flag').value.trim();
    body.trendBias = +document.getElementById('f_trendBias').value;
    body.priceOffset = +document.getElementById('f_priceOffset').value;
  }
  if (!body.symbol || !body.short || !body.label || !body.pair) {
    alert('Symbol, Short Code, Display Name, and Pair Display are required');
    return;
  }
  if (isOtc && !body.basePrice) {
    alert('Base Price is required for OTC pairs');
    return;
  }
  const res = id
    ? await api('/api/admin/pairs/' + id, { method: 'PUT', body })
    : await api('/api/admin/pairs', { method: 'POST', body });
  if (res?.success) {
    closeModal();
    renderPairs();
  } else {
    alert('Failed: ' + (res?.message || 'Unknown error'));
  }
}

async function togglePair(id){
  const res = await api('/api/admin/pairs/' + id + '/toggle', { method: 'POST' });
  if (res?.success) renderPairs();
  else alert('Toggle failed');
}

async function deletePair(id, symbol){
  if (!confirm('Delete pair "' + symbol + '"?\n\nThis will NOT delete past trades, but the pair will not be available anymore.')) return;
  const res = await api('/api/admin/pairs/' + id, { method: 'DELETE' });
  if (res?.success) renderPairs();
  else alert('Delete failed');
}

// OTC: Set exact price — updates basePrice in DB, frontend picks it up on next pair load
async function setOtcPrice(id, price){
  const p = parseFloat(price);
  if (!p || isNaN(p)) return alert('Enter a valid price');
  const res = await api('/api/admin/pairs/' + id + '/price-control', { method: 'POST', body: { basePrice: p } });
  if (res?.success) {
    // Show success flash
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✅ Saved!';
    btn.style.background = '#16a34a';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 1500);
  } else {
    alert('Failed: ' + (res?.message || 'Unknown error'));
  }
}

// OTC: Pump/Dump — sets trendBias (-1 to +1)
async function pumpDump(id, bias){
  const res = await api('/api/admin/pairs/' + id + '/price-control', { method: 'POST', body: { trendBias: bias } });
  if (res?.success) {
    const label = bias > 0 ? '📈 Pumping' : bias < 0 ? '📉 Dumping' : '⚖ Neutral';
    // Flash feedback
    const cards = document.querySelectorAll('.card');
    renderPairs();
  } else {
    alert('Failed: ' + (res?.message || 'Unknown error'));
  }
}

    const pad = n => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;

  const nowPlus = (hours) => toLocal(new Date(Date.now() + hours*3600*1000));
  const t = existing || {
    title:'', description:'', icon:'🏆', prize:1000, entryFee:0, maxParticipants:1000,

async function saveAffiliate(id){
  const res = await api('/api/admin/affiliates/' + id, {
    method: 'PUT',
    body: {
      tier: document.getElementById('aff_tier').value,
      isActive: document.getElementById('aff_status').value === 'true',
      availableBalance: +document.getElementById('aff_balance').value,
      totalBalance: +document.getElementById('aff_totalbal').value,
    }
  });
  if(res?.success){ closeModal(); renderAffiliates(); }
  else alert('Failed: ' + (res?.message || 'Unknown'));
}

async function addCommission(partnerId){
  const amount = +document.getElementById('comm_amount').value;
  if(!amount || amount <= 0) return alert('Enter valid amount');
  const res = await api('/api/admin/affiliates-commission', {
    method: 'POST',
    body: {
      partnerId,
      amount,
      type: document.getElementById('comm_type').value,
      description: document.getElementById('comm_desc').value.trim(),
    }
  });
  if(res?.success){
    alert('Commission added: $' + amount);
    closeModal();
    renderAffiliates();
  } else {
    alert('Failed: ' + (res?.message || 'Unknown'));
  }
}

async function deleteAffiliate(id, name){
  if(!confirm('Delete partner "' + name + '"?\n\nAll referrals, commissions, and withdrawals will be deleted!')) return;
  const res = await api('/api/admin/affiliates/' + id, {method:'DELETE'});
  if(res?.success) renderAffiliates();
  else alert('Failed');
}

async function processAffWd(id, status){
  let body = { status };
  if(status === 'rejected'){
    const reason = prompt('Rejection reason (optional):');
    body.rejectionReason = reason || '';
  }
  if(status === 'completed'){
    const ref = prompt('Transaction reference (optional):');
    body.transactionRef = ref || '';
  }
  const res = await api('/api/admin/affiliates-withdrawals/' + id, { method: 'PUT', body });
  if(res?.success) renderAffiliateWithdrawals();
  else alert('Failed: ' + (res?.message || 'Unknown'));
}

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px">
        <div><label style="font-size:10px;color:#7a85a0;text-transform:uppercase;font-weight:600">Min Deposit ($)</label><input id="dpMinDeposit" type="number" placeholder="10" value="10" style="width:100%;padding:10px;background:#0c1120;border:1px solid #1c2238;border-radius:6px;color:#fff;box-sizing:border-box"></div>
        <div><label style="font-size:10px;color:#7a85a0;text-transform:uppercase;font-weight:600">Max Uses (0=unlimited)</label><input id="dpMaxUses" type="number" placeholder="0" value="0" style="width:100%;padding:10px;background:#0c1120;border:1px solid #1c2238;border-radius:6px;color:#fff;box-sizing:border-box"></div>
        <div><label style="font-size:10px;color:#7a85a0;text-transform:uppercase;font-weight:600">Expires</label><input id="dpExpiry" type="date" style="width:100%;padding:10px;background:#0c1120;border:1px solid #1c2238;border-radius:6px;color:#fff;box-sizing:border-box"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" onclick="createDepositPromo()">Create</button>
        <button class="btn" onclick="document.getElementById('dpCreateForm').style.display='none'">Cancel</button>
      </div>
    </div>

    ${codes.length===0 ? '<div class="empty"><div class="empty-icon">🎁</div>No deposit promo codes yet<br><small>Create your first promo code for deposit bonuses</small></div>' : `
    <div class="table-wrap"><table>
      <thead><tr><th>Code</th><th>Type</th><th>Bonus</th><th>Min Deposit</th><th>Usage</th><th>Expires</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${codes.map(c=>`
        <tr>
          <td style="font-family:monospace;font-size:15px;font-weight:700;letter-spacing:2px;color:#60a5fa">${c.code}</td>
          <td>${c.type==='percentage'?'📊 Percentage':'💵 Fixed'}</td>
          <td class="mono" style="font-weight:700;color:#22c55e">${c.type==='percentage'?c.value+'%':'$'+c.value}</td>
          <td class="mono">$${c.minDeposit||10}</td>
          <td class="mono">${c.usedCount||0}${c.maxUses>0?' / '+c.maxUses:' / ∞'}</td>
          <td style="font-size:11px;color:#7a85a0">${c.expiresAt?fmtDate(c.expiresAt):'Never'}</td>
          <td><span class="badge ${c.active?'b-green':'b-red'}">${c.active?'Active':'Disabled'}</span></td>
          <td><div class="row-actions">
            <button class="btn btn-sm" onclick="toggleDepositPromo('${c._id}',${!c.active})">${c.active?'🚫 Disable':'✅ Enable'}</button>
            <button class="icon-btn" onclick="deleteDepositPromo('${c._id}','${c.code}')">🗑</button>
          </div></td>
        </tr>`).join('')}</tbody>
    </table></div>`}
  `;
}

function showCreateDepositPromo(){ document.getElementById('dpCreateForm').style.display='block'; }

async function createDepositPromo(){
  const code = document.getElementById('dpCode').value.trim().toUpperCase();
  const type = document.getElementById('dpType').value;
  const value = parseFloat(document.getElementById('dpValue').value);
  const minDeposit = parseFloat(document.getElementById('dpMinDeposit').value) || 10;
  const maxUses = parseInt(document.getElementById('dpMaxUses').value) || 0;
  const expiresAt = document.getElementById('dpExpiry').value || null;
  if(!code||!value){ alert('Code and value are required'); return; }
  const res = await api('/api/admin/deposit-promos', { method:'POST', body:{ code, type, value, minDeposit, maxUses, expiresAt } });
  if(res?.success){ renderDepositPromos(); }
  else alert('Failed: ' + (res?.message || 'Unknown error'));
}

async function toggleDepositPromo(id, active){
  const res = await api('/api/admin/deposit-promos/' + id, { method:'PUT', body:{ active } });
  if(res?.success) renderDepositPromos();
}

async function deleteDepositPromo(id, code){
  if(!confirm('Delete promo code "' + code + '"?')) return;
  const res = await api('/api/admin/deposit-promos/' + id, { method:'DELETE' });
  if(res?.success) renderDepositPromos();
}

// SUPPORT TICKETS
let supportFilter = 'all';
let supportPage = 1;

async function renderSupport(){
  const statusParam = supportFilter === 'all' ? '' : `&status=${supportFilter}`;
  const data = await api(`/api/admin/support/all?page=${supportPage}&limit=20${statusParam}`);
  const tickets = data?.tickets || [];
  const total = data?.total || 0;
  const pages = data?.pages || 1;

  const statusColors = {open:'#3b82f6',in_progress:'#eab308',awaiting_reply:'#22c55e',resolved:'#7a85a0',closed:'#4a5570'};
  const statusLabels = {open:'Open',in_progress:'In Progress',awaiting_reply:'Awaiting Reply',resolved:'Resolved',closed:'Closed'};
  const prioColors = {low:'#4a5570',medium:'#3b82f6',high:'#eab308',urgent:'#ef4444'};

  const filters = ['all','open','in_progress','awaiting_reply','resolved','closed'];

  document.getElementById('pageContent').innerHTML = `
    <div class="page-header"><div><div class="page-title">🎫 Support Tickets</div><div class="page-subtitle">${total} total tickets</div></div></div>
    <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">
      ${filters.map(f=>`<button onclick="supportFilter='${f}';supportPage=1;renderSupport()" style="padding:6px 14px;border-radius:6px;border:1px solid ${supportFilter===f?'#00ff9d33':'#1c2238'};background:${supportFilter===f?'#00ff9d15':'transparent'};color:${supportFilter===f?'#00ff9d':'#7a85a0'};font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">${f==='all'?'All':statusLabels[f]||f}</button>`).join('')}
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Ticket ID</th><th>User</th><th>Subject</th><th>Category</th><th>Priority</th><th>Status</th><th>Last Reply</th><th>Actions</th></tr></thead>
      <tbody>
        ${tickets.length===0?'<tr><td colspan="8" style="text-align:center;padding:30px;color:#7a85a0">No tickets found</td></tr>':''}
        ${tickets.map(t=>{
          const sc = statusColors[t.status]||'#7a85a0';
          const pc = prioColors[t.priority]||'#7a85a0';
          const timeAgo = getTimeAgo(t.lastReplyAt||t.updatedAt||t.createdAt);
          return `<tr>
            <td><span style="font-weight:600;color:#e8ecf4">${t.ticketId||'--'}</span></td>
            <td><div style="font-size:12px;color:#e8ecf4;font-weight:500">${t.userName||'Unknown'}</div><div style="font-size:10px;color:#7a85a0">${t.userEmail||''}</div></td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.subject||'--'}</td>
            <td><span style="font-size:10px;padding:2px 8px;border-radius:4px;background:#1a2035;color:#7a85a0">${t.category||'other'}</span></td>
            <td><span style="font-size:10px;font-weight:600;color:${pc}">${(t.priority||'medium').toUpperCase()}</span></td>
            <td><span style="font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;background:${sc}22;color:${sc}">${statusLabels[t.status]||t.status}</span></td>
            <td style="font-size:11px;color:#7a85a0">${t.lastReplyBy==='user'?'👤':'🛡️'} ${timeAgo}</td>
            <td><button onclick="openSupportTicket('${t._id}')" style="padding:5px 12px;border-radius:5px;border:1px solid #00ff9d33;background:#00ff9d15;color:#00ff9d;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit">View</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
    ${pages>1?`<div style="display:flex;gap:6px;margin-top:12px;justify-content:center">${Array.from({length:pages},(_,i)=>`<button onclick="supportPage=${i+1};renderSupport()" style="padding:4px 10px;border-radius:4px;border:1px solid ${supportPage===i+1?'#00ff9d33':'#1c2238'};background:${supportPage===i+1?'#00ff9d15':'transparent'};color:${supportPage===i+1?'#00ff9d':'#7a85a0'};font-size:11px;cursor:pointer;font-family:inherit">${i+1}</button>`).join('')}</div>`:''}
    <div id="ticketDetailModal" style="display:none"></div>
  `;
}

function getTimeAgo(d){
  if(!d) return '--';
  const ms = Date.now() - new Date(d).getTime();
  const m = Math.floor(ms/60000);
  if(m<1) return 'Just now';
  if(m<60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

async function openSupportTicket(id){
  const data = await api(`/api/admin/support/all?limit=100`);
  const tickets = data?.tickets || [];
  const t = tickets.find(tk=>tk._id===id);
  if(!t){ alert('Ticket not found'); return; }

  const statusColors = {open:'#3b82f6',in_progress:'#eab308',awaiting_reply:'#22c55e',resolved:'#7a85a0',closed:'#4a5570'};
  const statusLabels = {open:'Open',in_progress:'In Progress',awaiting_reply:'Awaiting Reply',resolved:'Resolved',closed:'Closed'};
  const prioColors = {low:'#4a5570',medium:'#3b82f6',high:'#eab308',urgent:'#ef4444'};
  const statuses = ['open','in_progress','awaiting_reply','resolved','closed'];
  const priorities = ['low','medium','high','urgent'];

  const msgs = (t.messages||[]).map(msg=>`
    <div style="display:flex;flex-direction:column;align-items:${msg.sender==='admin'?'flex-end':'flex-start'};margin-bottom:10px">
      <div style="max-width:80%;padding:10px 14px;border-radius:${msg.sender==='admin'?'12px 12px 2px 12px':'12px 12px 12px 2px'};background:${msg.sender==='admin'?'#00ff9d18':'#1a2035'};border:1px solid ${msg.sender==='admin'?'#00ff9d33':'#1c2238'}">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <span style="font-size:10px;font-weight:600;color:${msg.sender==='admin'?'#00ff9d':'#3b82f6'}">${msg.sender==='admin'?'🛡️ Admin':'👤 '+( msg.senderName||'User')}</span>
          <span style="font-size:9px;color:#4a5570">${getTimeAgo(msg.createdAt)}</span>
        </div>
        <div style="font-size:12px;color:#e8ecf4;line-height:1.5;white-space:pre-wrap">${msg.text}</div>
        ${(msg.attachments||[]).length>0?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">${msg.attachments.map((a,j)=>`<a href="${a}" target="_blank" style="font-size:9px;padding:3px 8px;border-radius:4px;background:#0b0e18;border:1px solid #1c2238;color:#00ff9d;text-decoration:none">📎 File ${j+1}</a>`).join('')}</div>`:''}
      </div>
    </div>
  `).join('');

  document.getElementById('pageContent').innerHTML = `
    <div style="margin-bottom:16px">
      <button onclick="renderSupport()" style="display:flex;align-items:center;gap:4px;background:none;border:none;color:#7a85a0;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;padding:0">
        <span style="font-size:16px">←</span> Back to tickets
      </button>
    </div>

    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <!-- Left: Messages -->
      <div style="flex:1;min-width:300px">
        <div style="background:#151c2e;border:1px solid #1c2238;border-radius:12px;overflow:hidden">
          <!-- Header -->
          <div style="padding:16px 20px;border-bottom:1px solid #1c2238">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
              <span style="font-size:15px;font-weight:700;color:#e8ecf4">${t.subject}</span>
              <span style="font-size:10px;font-weight:600;padding:3px 10px;border-radius:5px;background:${statusColors[t.status]}22;color:${statusColors[t.status]}">${statusLabels[t.status]}</span>
            </div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <span style="font-size:10px;color:#7a85a0">${t.ticketId}</span>
              <span style="font-size:10px;padding:2px 6px;border-radius:3px;background:#1a2035;color:#7a85a0">${t.category||'other'}</span>
              <span style="font-size:10px;font-weight:600;color:${prioColors[t.priority]}">${(t.priority||'medium').toUpperCase()}</span>
              <span style="font-size:10px;color:#4a5570">by ${t.userName||'Unknown'} (${t.userEmail||''})</span>
            </div>
          </div>

          <!-- Messages -->
          <div style="padding:16px 20px;max-height:400px;overflow-y:auto" id="ticketMessages">
            ${msgs||'<div style="text-align:center;padding:20px;color:#4a5570;font-size:12px">No messages</div>'}
          </div>

          <!-- Reply box -->
          ${t.status!=='closed'?`
          <div style="padding:12px 20px;border-top:1px solid #1c2238">
            <textarea id="adminReplyText" placeholder="Type your reply..." style="width:100%;min-height:60px;background:#1a2035;border:1px solid #1c2238;border-radius:8px;padding:10px 12px;color:#e8ecf4;font-size:12px;font-family:inherit;resize:vertical;outline:none;box-sizing:border-box" rows="3"></textarea>
            <div style="display:flex;justify-content:flex-end;margin-top:8px">
              <button onclick="sendAdminReply('${t._id}')" style="padding:8px 20px;border-radius:6px;border:none;background:linear-gradient(135deg,#00ff9d,#00cc7d);color:#0b0e18;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Send Reply</button>
            </div>
          </div>
          `:`<div style="padding:12px 20px;border-top:1px solid #1c2238;text-align:center;color:#4a5570;font-size:11px">Ticket closed</div>`}
        </div>
      </div>

      <!-- Right: Controls -->
      <div style="width:260px;flex-shrink:0">
        <div style="background:#151c2e;border:1px solid #1c2238;border-radius:12px;padding:16px 18px">
          <div style="font-size:12px;font-weight:700;color:#e8ecf4;margin-bottom:14px">Ticket Controls</div>

          <div style="margin-bottom:14px">
            <div style="font-size:10px;color:#7a85a0;font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em">Status</div>
            <select id="ticketStatus" onchange="updateTicketField('${t._id}','status',this.value)" style="width:100%;padding:8px 10px;border-radius:6px;border:1px solid #1c2238;background:#1a2035;color:#e8ecf4;font-size:12px;font-family:inherit;outline:none;cursor:pointer">
              ${statuses.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${statusLabels[s]}</option>`).join('')}
            </select>
          </div>

          <div style="margin-bottom:14px">
            <div style="font-size:10px;color:#7a85a0;font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em">Priority</div>
            <select id="ticketPriority" onchange="updateTicketField('${t._id}','priority',this.value)" style="width:100%;padding:8px 10px;border-radius:6px;border:1px solid #1c2238;background:#1a2035;color:#e8ecf4;font-size:12px;font-family:inherit;outline:none;cursor:pointer">
              ${priorities.map(p=>`<option value="${p}" ${t.priority===p?'selected':''}>${p.charAt(0).toUpperCase()+p.slice(1)}</option>`).join('')}
            </select>
          </div>

          <div style="margin-bottom:14px">
            <div style="font-size:10px;color:#7a85a0;font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em">Info</div>
            <div style="font-size:11px;color:#7a85a0;line-height:1.8">
              <div>Created: ${new Date(t.createdAt).toLocaleString()}</div>
              <div>Updated: ${new Date(t.updatedAt).toLocaleString()}</div>
              <div>Messages: ${(t.messages||[]).length}</div>
              <div>Last reply by: ${t.lastReplyBy==='admin'?'🛡️ Admin':'👤 User'}</div>
            </div>
          </div>

          ${t.status!=='closed'?`<button onclick="updateTicketField('${t._id}','status','closed')" style="width:100%;padding:8px 0;border-radius:6px;border:1px solid #ef444444;background:#ef444415;color:#ef4444;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px">Close Ticket</button>`:''}
        </div>
      </div>
    </div>
  `;
}

async function sendAdminReply(ticketId){
  const text = document.getElementById('adminReplyText')?.value?.trim();
  if(!text){ alert('Please type a reply'); return; }
  const res = await api('/api/admin/support/'+ticketId+'/reply', {
    method: 'POST',
    body: { message: text }
  });
  if(res?.success){
    openSupportTicket(ticketId);
  } else {
    alert('Failed to send reply: '+(res?.error||'Unknown error'));
  }
}

async function updateTicketField(ticketId, field, value){
  const body = {};
  body[field] = value;
  const res = await api('/api/admin/support/'+ticketId, {
    method: 'PATCH',
    body: body
  });
  if(res?.success){
    openSupportTicket(ticketId);
  } else {
    alert('Failed to update: '+(res?.error||'Unknown error'));
  }
}
